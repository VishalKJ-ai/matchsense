[project]
name = "matchsense"
version = "0.1.0"
description = "Explainable, personalised match intelligence from a tracking-grade synthetic football simulator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
matchsense-sim = "matchsense.sim.cli:main"
matchsense-live = "matchsense.live.cli:main"
matchsense-web = "matchsense.web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchsense = ["analytics/models/*.json", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a full 90-minute simulation"]
